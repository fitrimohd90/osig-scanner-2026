<script>
  const API_URL =
    "https://script.google.com/macros/s/AKfycbzaFdaQyadvCNGG6AlwAZsbCBPH7rRF-k3FiBAzE2mnDmTGMil6gMtV4ypM9kOUYcgv/exec";

  let sudahScan = false;

  function semakTiket(serial) {
    const resultBox = document.getElementById("result");

    resultBox.className = "checking";
    resultBox.innerHTML =
      "MENYEMAK TIKET...<br><br>" + serial;

    const callbackName = "jsonpCallback_" + Date.now();

    window[callbackName] = function(data) {

      if (data.status === "VALID") {
        resultBox.className = "valid";
        resultBox.innerHTML =
          "✅ TIKET SAH<br><br>" + data.serial;
      } else {
        resultBox.className = "invalid";
        resultBox.innerHTML =
          "❌ TIKET TIDAK SAH<br><br>" + serial;
      }

      delete window[callbackName];
      script.remove();
    };

    const script = document.createElement("script");

    script.src =
      API_URL +
      "?serial=" + encodeURIComponent(serial) +
      "&callback=" + callbackName;

    script.onerror = function() {
      resultBox.className = "invalid";
      resultBox.innerHTML =
        "RALAT SAMBUNGAN";

      delete window[callbackName];
      script.remove();
    };

    document.body.appendChild(script);
  }

  function onScanSuccess(decodedText) {

    if (sudahScan) return;

    sudahScan = true;

    html5QrCode.stop()
      .then(() => {
        semakTiket(decodedText);
      })
      .catch(() => {
        semakTiket(decodedText);
      });
  }

  const html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras()
    .then(cameras => {

      if (cameras && cameras.length) {

        const cameraId = cameras[cameras.length - 1].id;

        html5QrCode.start(
          cameraId,
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },
          onScanSuccess
        );

      } else {
        document.getElementById("result").innerText =
          "Kamera tidak dijumpai.";
      }

    })
    .catch(error => {
      document.getElementById("result").innerText =
        "Kamera tidak dapat dibuka: " + error;
    });
</script>
