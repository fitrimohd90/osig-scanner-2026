<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner OSiG 2026</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 24px 18px;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 30px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 25px;
    }

    #reader {
      width: 100%;
      background: black;
      border-radius: 14px;
      overflow: hidden;
    }

    #result {
      margin-top: 20px;
      padding: 25px 15px;
      border-radius: 14px;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #222;
    }

    .status-title {
      font-size: 25px;
      font-weight: bold;
    }

    .tarikh {
      margin-top: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .serial {
      margin-top: 8px;
      font-size: 15px;
      opacity: 0.85;
    }


    /* =========================
       HIJAU - TIKET SAH
       ========================= */

    .valid {
      background: #173d25 !important;
      border: 2px solid #35c46a;
    }


    /* =========================
       KUNING - SUDAH DIGUNAKAN
       ========================= */

    .used {
      background: #493c12 !important;
      border: 2px solid #e5ba32;
    }


    /* =========================
       MERAH - TIADA DATABASE
       ========================= */

    .invalid {
      background: #491c1c !important;
      border: 2px solid #e54c4c;
    }


    /* ERROR SISTEM */

    .error {
      background: #333 !important;
      border: 2px solid #777;
    }


    button {
      width: 100%;
      padding: 16px;
      margin-top: 18px;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

  </style>
</head>


<body>

  <div class="container">

    <h1>Scanner OSiG 2026</h1>

    <div class="subtitle">
      Imbas QR e-Tiket
    </div>


    <div id="reader"></div>


    <div id="result">

      <div class="status-title">
        SEDIA UNTUK IMBAS
      </div>

    </div>


    <button id="scanButton" onclick="scanSemula()">
      IMBAS TIKET SETERUSNYA
    </button>

  </div>



<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzaFdaQyadvCNGG6AlwAZsbCBPH7rRF-k3FiBAzE2mnDmTGMil6gMtV4ypM9kOUYcgv/exec";


let html5QrCode = new Html5Qrcode("reader");

let cameraId = null;

let sedangScan = false;

let sudahScan = false;


// =====================================================
// START CAMERA
// =====================================================

async function mulaScanner() {

  if (sedangScan) return;

  sedangScan = true;
  sudahScan = false;

  const result = document.getElementById("result");
  const button = document.getElementById("scanButton");

  button.style.display = "none";

  result.className = "";

  result.innerHTML = `
    <div class="status-title">
      SEDIA UNTUK IMBAS
    </div>
  `;


  try {

    if (!cameraId) {

      const cameras =
        await Html5Qrcode.getCameras();

      if (!cameras || cameras.length === 0) {
        throw new Error("Tiada kamera dijumpai.");
      }


      // Pilih kamera belakang jika ada
      const kameraBelakang =
        cameras.find(cam =>
          cam.label.toLowerCase().includes("back") ||
          cam.label.toLowerCase().includes("rear")
        );

      cameraId =
        kameraBelakang
          ? kameraBelakang.id
          : cameras[cameras.length - 1].id;
    }


    await html5QrCode.start(

      cameraId,

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      async function(decodedText) {

        if (sudahScan) return;

        sudahScan = true;

        try {

          await html5QrCode.stop();

        } catch (e) {}


        sedangScan = false;

        semakTiket(decodedText);

      },

      function(errorMessage) {
        // QR belum dijumpai - abaikan
      }

    );


  } catch (err) {

    sedangScan = false;

    result.className = "error";

    result.innerHTML = `
      <div class="status-title">
        KAMERA TIDAK DAPAT DIBUKA
      </div>

      <div class="serial">
        ${err.message}
      </div>
    `;

    button.style.display = "block";

  }

}



// =====================================================
// SEMAK TIKET MELALUI JSONP
// =====================================================

function semakTiket(serial) {

  serial = serial.trim();

  const result =
    document.getElementById("result");

  const button =
    document.getElementById("scanButton");


  result.className = "";

  result.innerHTML = `
    <div class="status-title">
      MENYEMAK TIKET...
    </div>
  `;


  const callbackName =
    "osigCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);


  const script =
    document.createElement("script");


  let timeout;


  window[callbackName] = function(data) {

    clearTimeout(timeout);

    delete window[callbackName];

    script.remove();

    paparKeputusan(data);

  };


  script.onerror = function() {

    clearTimeout(timeout);

    delete window[callbackName];

    script.remove();

    paparKeputusan({
      status: "ERROR",
      message: "Gagal menghubungi sistem."
    });

  };


  script.src =
    API_URL +
    "?serial=" +
    encodeURIComponent(serial) +
    "&callback=" +
    encodeURIComponent(callbackName);


  document.body.appendChild(script);


  timeout = setTimeout(function() {

    if (window[callbackName]) {

      delete window[callbackName];

      script.remove();

      paparKeputusan({
        status: "ERROR",
        message: "Sambungan mengambil masa terlalu lama."
      });

    }

  }, 10000);

}



// =====================================================
// PAPAR KEPUTUSAN
// =====================================================

function paparKeputusan(data) {

  const result =
    document.getElementById("result");

  const button =
    document.getElementById("scanButton");


  // ===================================================
  // TIKET SAH - BELUM DIGUNAKAN
  // ===================================================

  if (data.status === "VALID") {

    result.className = "valid";

    result.innerHTML = `
      <div class="status-title">
        ✅ TIKET SAH
      </div>

      ${
        data.tarikh
        ? `
        <div class="tarikh">
          ${data.hari} • ${data.tarikh}
        </div>
        `
        : ""
      }

      <div class="serial">
        ${data.serial || ""}
      </div>
    `;

  }


  // ===================================================
  // TIKET SAH - SUDAH DIGUNAKAN
  // ===================================================

  else if (data.status === "USED") {

    result.className = "used";

    result.innerHTML = `
      <div class="status-title">
        ⚠️ TIKET TELAH DIGUNAKAN
      </div>

      ${
        data.tarikh
        ? `
        <div class="tarikh">
          ${data.hari} • ${data.tarikh}
        </div>
        `
        : ""
      }

      <div class="serial">
        ${data.serial || ""}
      </div>
    `;

  }


  // ===================================================
  // TIKET TAK WUJUD DALAM DATABASE
  // ===================================================

  else if (data.status === "INVALID") {

    result.className = "invalid";

    result.innerHTML = `
      <div class="status-title">
        ❌ TIKET TIDAK SAH
      </div>

      <div class="tarikh">
        TIDAK WUJUD DALAM DATABASE
      </div>

      <div class="serial">
        ${data.serial || ""}
      </div>
    `;

  }


  // ===================================================
  // ERROR SISTEM
  // ===================================================

  else {

    result.className = "error";

    result.innerHTML = `
      <div class="status-title">
        RALAT SISTEM
      </div>

      <div class="serial">
        ${data.message || "Ralat tidak diketahui."}
      </div>
    `;

  }


  button.style.display = "block";

}



// =====================================================
// SCAN SETERUSNYA
// =====================================================

function scanSemula() {

  sudahScan = false;

  mulaScanner();

}



// =====================================================
// START
// =====================================================

mulaScanner();

</script>

</body>
</html>
