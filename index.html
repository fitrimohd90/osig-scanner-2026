<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Orkestra Siswa Guru MADANI 2026</title>

  <link rel="manifest" href="./manifest.json">

  <meta name="theme-color" content="#111111">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Scanner OSiG">

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    /* =====================================================
       ROOT
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #080808;
      --panel: #121212;

      --gold: #d7aa3f;
      --gold-light: #f0c75e;

      --white: #f5f5f5;
      --muted: #8d8d8d;

      --green: #38c56d;
      --green-bg: #123d22;

      --yellow: #e4b733;
      --yellow-bg: #493a0e;

      --red: #e45050;
      --red-bg: #471919;

      --gray: #777;
    }


    html,
    body {
      margin: 0;
      padding: 0;

      min-height: 100%;

      background: var(--bg);

      color: var(--white);

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(215, 170, 63, 0.07),
          transparent 34%
        ),
        linear-gradient(
          180deg,
          #090909 0%,
          #070707 100%
        );
    }


    /* =====================================================
       PAGE
       ===================================================== */

    .page {
      width: 100%;
      max-width: 520px;

      min-height: 100vh;

      margin: 0 auto;

      padding:
        18px
        18px
        calc(24px + env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      position: relative;

      padding:
        8px
        6px
        20px;

      text-align: center;
    }


    .brand {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 10px;
    }


    /* -----------------------------------------------------
       LOGO MUZIK
       ----------------------------------------------------- */

    .music-logo {
      flex-shrink: 0;

      width: 58px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 66px;
      line-height: 0.88;

      color: var(--gold-light);

      transform: translateY(2px);

      text-shadow:
        0 0 14px
        rgba(215, 170, 63, 0.18);
    }


    /* -----------------------------------------------------
       TEKS HEADER
       ----------------------------------------------------- */

    .brand-text {
      width: min-content;

      text-align: left;
    }


    .title-row-1 {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(44px, 11vw, 58px);

      line-height: 0.9;

      font-weight: 600;

      letter-spacing: -1px;

      color: var(--gold-light);

      white-space: nowrap;
    }


    .title-row-2 {
      margin-top: 3px;

      width: 100%;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(16px, 4.25vw, 22px);

      line-height: 1;

      font-weight: 600;

      color: var(--white);

      white-space: nowrap;

      text-align: justify;
      text-align-last: justify;
    }


    /* =====================================================
       VENUE
       ===================================================== */

    .venue {
      margin-top: 14px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 12px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 12px;

      letter-spacing: 4px;

      color: #e1e1e1;
    }


    .venue::before,
    .venue::after {
      content: "";

      display: block;

      width: 62px;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--gold)
        );
    }


    .venue::after {
      background:
        linear-gradient(
          90deg,
          var(--gold),
          transparent
        );
    }


    /* =====================================================
       GOLD WAVE DECORATION
       ===================================================== */

    .header-wave {
      position: absolute;

      left: -35px;
      right: -35px;
      bottom: -8px;

      height: 55px;

      pointer-events: none;

      overflow: hidden;

      opacity: 0.25;
    }


    .header-wave::before,
    .header-wave::after {
      content: "";

      position: absolute;

      width: 80%;
      height: 60px;

      bottom: -43px;

      border-top:
        1px solid
        rgba(215, 170, 63, 0.65);

      border-radius: 50%;
    }


    .header-wave::before {
      left: -10%;
      transform: rotate(6deg);
    }


    .header-wave::after {
      right: -10%;
      transform: rotate(-6deg);
    }


    /* =====================================================
       CAMERA FRAME
       ===================================================== */

    .camera-frame {
      position: relative;

      width: 100%;

      margin-top: 10px;

      border:
        2px solid
        var(--gold-light);

      border-radius: 22px;

      overflow: hidden;

      background: #000;

      box-shadow:
        0 0 20px
        rgba(215, 170, 63, 0.1);
    }


    #reader {
      width: 100%;

      min-height: 365px;

      background: #000;

      overflow: hidden;
    }


    #reader video {
      width: 100% !important;

      min-height: 365px;

      object-fit: cover !important;

      border-radius: 20px;
    }


    /* =====================================================
       CLEAN html5-qrcode UI
       ===================================================== */

    #reader__dashboard_section_csr span,
    #reader__dashboard_section_swaplink,
    #reader__status_span {
      display: none !important;
    }


    #reader img {
      display: none !important;
    }


    #reader__scan_region {
      background: transparent !important;
    }


    /* =====================================================
       READY / RESULT PANEL
       ===================================================== */

    #result {
      position: relative;

      width: 100%;

      min-height: 128px;

      margin-top: 18px;

      padding:
        20px
        18px;

      border:
        2px solid
        var(--gold-light);

      border-radius: 22px;

      background:
        radial-gradient(
          circle at 50% 55%,
          rgba(215, 170, 63, 0.08),
          transparent 68%
        ),
        #141414;

      box-shadow:
        0 0 20px
        rgba(215, 170, 63, 0.1);

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      overflow: hidden;
    }


    /* -----------------------------------------------------
       GOLD WAVES DALAM STATUS BOX
       ----------------------------------------------------- */

    #result::before,
    #result::after {
      content: "";

      position: absolute;

      bottom: -42px;

      width: 72%;
      height: 75px;

      border-top:
        1px solid
        rgba(215, 170, 63, 0.28);

      border-radius: 50%;

      pointer-events: none;
    }


    #result::before {
      left: -8%;

      transform: rotate(7deg);
    }


    #result::after {
      right: -8%;

      transform: rotate(-7deg);
    }


    /* =====================================================
       STATUS TEXT
       ===================================================== */

    .status-title {
      position: relative;

      z-index: 2;

      font-size: clamp(27px, 7vw, 34px);

      line-height: 1.15;

      font-weight: 700;

      letter-spacing: 0.25px;

      color: var(--white);
    }


    .tarikh {
      position: relative;

      z-index: 2;

      margin-top: 15px;

      font-size: clamp(17px, 4.4vw, 21px);

      line-height: 1.25;

      font-weight: 700;

      color: var(--white);
    }


    .serial {
      position: relative;

      z-index: 2;

      margin-top: 10px;

      font-size: 16px;

      letter-spacing: 0.4px;

      color:
        rgba(255, 255, 255, 0.7);
    }


    /* =====================================================
       STATUS COLOURS
       ===================================================== */

    #result.valid {
      border-color: var(--green);

      background:
        radial-gradient(
          circle at center,
          rgba(56, 197, 109, 0.12),
          transparent 70%
        ),
        var(--green-bg);

      box-shadow:
        0 0 20px
        rgba(56, 197, 109, 0.18);
    }


    #result.used {
      border-color: var(--yellow);

      background:
        radial-gradient(
          circle at center,
          rgba(228, 183, 51, 0.12),
          transparent 70%
        ),
        var(--yellow-bg);

      box-shadow:
        0 0 20px
        rgba(228, 183, 51, 0.17);
    }


    #result.invalid {
      border-color: var(--red);

      background:
        radial-gradient(
          circle at center,
          rgba(228, 80, 80, 0.13),
          transparent 70%
        ),
        var(--red-bg);

      box-shadow:
        0 0 20px
        rgba(228, 80, 80, 0.17);
    }


    #result.error {
      border-color: var(--gray);

      background: #202020;
    }


    /* =====================================================
       BUTTON
       ===================================================== */

    #scanButton {
      display: none;

      width: 100%;

      margin-top: 18px;

      padding:
        17px
        15px;

      border: 0;

      border-radius: 16px;

      background: #f1f1f1;

      color: #111;

      font-size: 18px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.1s ease,
        opacity 0.1s ease;
    }


    #scanButton:active {
      transform: scale(0.98);

      opacity: 0.85;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    footer {
      margin-top: 14px;

      padding-top: 10px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 14px;

      color: #777;

      font-size: 14px;

      letter-spacing: 0.4px;
    }


    footer::before,
    footer::after {
      content: "";

      width: 72px;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #555
        );
    }


    footer::after {
      background:
        linear-gradient(
          90deg,
          #555,
          transparent
        );
    }


    /* =====================================================
       SMALL PHONES
       ===================================================== */

    @media (max-width: 390px) {

      .page {
        padding-left: 14px;
        padding-right: 14px;
      }


      .music-logo {
        width: 50px;

        font-size: 59px;
      }


      .brand {
        gap: 7px;
      }


      .title-row-1 {
        font-size: 41px;
      }


      .title-row-2 {
        font-size: 15px;
      }


      .venue {
        font-size: 10px;

        letter-spacing: 3px;
      }


      .venue::before,
      .venue::after {
        width: 48px;
      }


      #reader,
      #reader video {
        min-height: 335px;
      }


      #result {
        min-height: 118px;

        padding:
          18px
          14px;
      }

    }

  </style>
</head>


<body>

<div class="page">


  <!-- =================================================
       HEADER
       ================================================= -->

  <header class="header">

    <div class="brand">


      <div class="music-logo">
        𝄞
      </div>


      <div class="brand-text">

        <div class="title-row-1">
          Orkestra
        </div>

        <div class="title-row-2">
          Siswa Guru MADANI 2026
        </div>

      </div>


    </div>


    <div class="venue">
      DEWAN SRI PINANG
    </div>


    <div class="header-wave"></div>

  </header>



  <!-- =================================================
       CAMERA
       ================================================= -->

  <div
    class="camera-frame"
    id="cameraFrame"
  >

    <div id="reader"></div>

  </div>



  <!-- =================================================
       STATUS / READY
       ================================================= -->

  <div id="result">

    <div class="status-title">
      SEDIA UNTUK IMBAS
    </div>

  </div>



  <!-- =================================================
       BUTTON
       ================================================= -->

  <button
    id="scanButton"
    onclick="scanSemula()"
  >
    IMBAS TIKET SETERUSNYA
  </button>



  <!-- =================================================
       FOOTER
       ================================================= -->

  <footer>
    © FitriMohd 2026
  </footer>


</div>



<script>

/* =====================================================
   API
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzaFdaQyadvCNGG6AlwAZsbCBPH7rRF-k3FiBAzE2mnDmTGMil6gMtV4ypM9kOUYcgv/exec";



/* =====================================================
   GLOBAL VARIABLES
   ===================================================== */

let html5QrCode =
  new Html5Qrcode("reader");

let cameraId = null;

let sedangScan = false;

let sudahScan = false;



/* =====================================================
   SAFE HTML
   ===================================================== */

function safe(value) {

  return String(value || "")

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}



/* =====================================================
   READY
   ===================================================== */

function paparReady() {

  const result =
    document.getElementById("result");


  result.className = "";


  result.innerHTML = `

    <div class="status-title">
      SEDIA UNTUK IMBAS
    </div>

  `;

}



/* =====================================================
   START CAMERA
   ===================================================== */

async function mulaScanner() {


  if (sedangScan) {
    return;
  }


  sedangScan = true;

  sudahScan = false;


  const button =
    document.getElementById("scanButton");


  const cameraFrame =
    document.getElementById("cameraFrame");


  button.style.display =
    "none";


  cameraFrame.style.display =
    "block";


  paparReady();



  try {


    /* -------------------------------------------------
       GET CAMERA
       ------------------------------------------------- */

    if (!cameraId) {


      const cameras =
        await Html5Qrcode.getCameras();


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          "Tiada kamera dijumpai."
        );

      }


      const kameraBelakang =
        cameras.find(camera => {


          const label =
            camera.label.toLowerCase();


          return (

            label.includes("back") ||

            label.includes("rear") ||

            label.includes("environment")

          );

        });


      cameraId =
        kameraBelakang

          ? kameraBelakang.id

          : cameras[
              cameras.length - 1
            ].id;

    }



    /* -------------------------------------------------
       START
       ------------------------------------------------- */

    await html5QrCode.start(

      cameraId,


      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1
      },


      /* ------------------------------------------------
         SUCCESS
         ------------------------------------------------ */

      async function(decodedText) {


        if (sudahScan) {
          return;
        }


        sudahScan = true;


        try {

          await html5QrCode.stop();

        }

        catch (error) {

          /*
            Ignore stop error
          */

        }


        sedangScan = false;


        /*
          Kamera hilang bila result keluar.
        */

        cameraFrame.style.display =
          "none";


        semakTiket(
          decodedText
        );

      },


      /* ------------------------------------------------
         SCAN BELUM BERJAYA
         ------------------------------------------------ */

      function(errorMessage) {

        /*
          Abaikan.
          Library akan cuba scan semula.
        */

      }

    );


  }

  catch (error) {


    sedangScan = false;


    const result =
      document.getElementById("result");


    result.className =
      "error";


    result.innerHTML = `

      <div class="status-title">
        KAMERA TIDAK DAPAT DIBUKA
      </div>


      <div class="serial">
        ${safe(error.message)}
      </div>

    `;


    button.style.display =
      "block";

  }

}



/* =====================================================
   SEMAK TIKET VIA JSONP
   ===================================================== */

function semakTiket(serial) {


  serial =
    String(serial || "")
      .trim();


  const result =
    document.getElementById("result");


  result.className = "";


  result.innerHTML = `

    <div class="status-title">
      MENYEMAK TIKET...
    </div>

  `;



  /* ---------------------------------------------------
     CALLBACK NAME
     --------------------------------------------------- */

  const callbackName =
    "osigCallback_" +

    Date.now() +

    "_" +

    Math.floor(
      Math.random() * 100000
    );



  const script =
    document.createElement(
      "script"
    );


  let timeout;



  /* ---------------------------------------------------
     SUCCESS RESPONSE
     --------------------------------------------------- */

  window[callbackName] =
    function(data) {


      clearTimeout(
        timeout
      );


      delete window[
        callbackName
      ];


      script.remove();


      paparKeputusan(
        data
      );

    };



  /* ---------------------------------------------------
     SCRIPT ERROR
     --------------------------------------------------- */

  script.onerror =
    function() {


      clearTimeout(
        timeout
      );


      delete window[
        callbackName
      ];


      script.remove();


      paparKeputusan({

        status: "ERROR",

        message:
          "Gagal menghubungi sistem."

      });

    };



  /* ---------------------------------------------------
     REQUEST
     --------------------------------------------------- */

  script.src =
    API_URL +

    "?serial=" +

    encodeURIComponent(
      serial
    ) +

    "&callback=" +

    encodeURIComponent(
      callbackName
    );


  document.body.appendChild(
    script
  );



  /* ---------------------------------------------------
     TIMEOUT
     --------------------------------------------------- */

  timeout =
    setTimeout(

      function() {


        if (
          window[
            callbackName
          ]
        ) {


          delete window[
            callbackName
          ];


          script.remove();


          paparKeputusan({

            status:
              "ERROR",

            message:
              "Sambungan mengambil masa terlalu lama."

          });

        }

      },


      10000

    );

}



/* =====================================================
   PAPAR RESULT
   ===================================================== */

function paparKeputusan(data) {


  const result =
    document.getElementById(
      "result"
    );


  const button =
    document.getElementById(
      "scanButton"
    );


  const serial =
    safe(
      data.serial
    );


  const hari =
    safe(
      data.hari
    );


  const tarikh =
    safe(
      data.tarikh
    );



  /* ===================================================
     VALID
     =================================================== */

  if (
    data.status === "VALID"
  ) {


    result.className =
      "valid";


    result.innerHTML = `

      <div class="status-title">

        ✅ TIKET SAH

      </div>


      ${
        data.tarikh

        ? `

          <div class="tarikh">

            ${hari}
            •
            ${tarikh}

          </div>

        `

        : ""
      }


      <div class="serial">

        ${serial}

      </div>

    `;

  }



  /* ===================================================
     USED
     =================================================== */

  else if (
    data.status === "USED"
  ) {


    result.className =
      "used";


    result.innerHTML = `

      <div class="status-title">

        ⚠️ TIKET TELAH DIGUNAKAN

      </div>


      ${
        data.tarikh

        ? `

          <div class="tarikh">

            ${hari}
            •
            ${tarikh}

          </div>

        `

        : ""
      }


      <div class="serial">

        ${serial}

      </div>

    `;

  }



  /* ===================================================
     INVALID
     =================================================== */

  else if (
    data.status === "INVALID"
  ) {


    result.className =
      "invalid";


    result.innerHTML = `

      <div class="status-title">

        ❌ TIKET TIDAK SAH

      </div>


      <div class="tarikh">

        TIDAK WUJUD DALAM DATABASE

      </div>


      <div class="serial">

        ${serial}

      </div>

    `;

  }



  /* ===================================================
     SYSTEM ERROR
     =================================================== */

  else {


    result.className =
      "error";


    result.innerHTML = `

      <div class="status-title">

        RALAT SISTEM

      </div>


      <div class="serial">

        ${safe(
          data.message ||
          "Ralat tidak diketahui."
        )}

      </div>

    `;

  }



  button.style.display =
    "block";

}



/* =====================================================
   NEXT TICKET
   ===================================================== */

function scanSemula() {


  sudahScan = false;


  mulaScanner();

}




/* =====================================================
   SERVICE WORKER / PWA
   ===================================================== */

if ("serviceWorker" in navigator) {

  window.addEventListener("load", function() {

    navigator.serviceWorker
      .register("./sw.js")
      .catch(function(error) {

        console.warn(
          "Service worker gagal didaftarkan:",
          error
        );

      });

  });

}


/* =====================================================
   START APP
   ===================================================== */

mulaScanner();

</script>

</body>

</html>
